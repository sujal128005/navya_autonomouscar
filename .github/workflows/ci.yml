# Runs on every push and pull request: the offline logic tests and a firmware compile.
# A red cross on GitHub means something is broken - fix it before taking the car out.
name: checks

on:
  push:
  pull_request:

jobs:
  laptop-code:
    name: Laptop code (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The tests need no camera, Arduino or GPU, so only these three packages.
      - run: pip install numpy opencv-python-headless pyserial
      - name: Every file compiles
        run: python -m compileall -q autopilot
      - name: Logic tests
        working-directory: autopilot
        run: python test_logic.py

  firmware:
    name: Arduino firmware (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index && arduino-cli core install arduino:avr@1.8.8
      - name: Compile for the Uno
        run: arduino-cli compile --fqbn arduino:avr:uno --warnings more firmware/navya_drive
